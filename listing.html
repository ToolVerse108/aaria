<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aaria Property profile listing</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", Arial, sans-serif;
      background: #eef2f7;
      color: #1a1a1a;
    }

    .page-wrapper {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    /* Logo Styling */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 130px;
      height: auto;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #0066ff;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      font-size: 17px;
      color: #444;
      margin-bottom: 35px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 18px;
      color: #1a1a1a;
      border-left: 4px solid #0066ff;
      padding-left: 10px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    input[type=text],
    input[type=email],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5d5d5;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      background: #fafafa;
      transition: 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0066ff;
      background: #ffffff;
      outline: none;
      box-shadow: 0 0 4px rgba(0,102,255,0.4);
    }

    .checkbox-group label {
      font-weight: 500;
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }
    .checkbox-group input {
      margin-right: 8px;
    }

    .btn-submit {
      width: 100%;
      background: #0066ff;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #0052cc;
    }

    .note {
      font-size: 14px;
      color: #666;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    /* PRINT / SAVE SCREEN */
    #submissionSummary {
      display: none;
    }

    .summary-title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #0066ff;
      margin-bottom: 20px;
    }

    .summary-block {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .print-btn {
      width: 100%;
      background: #222;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .page-wrapper {
        padding: 15px;
        margin: 20px auto;
      }

      .logo-container img {
        width: 110px;
      }

      h1 {
        font-size: 26px;
      }
      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <!-- AARIA LOGO -->
  <div class="logo-container">
    <img src="aarialogo.png" alt="AARIA Logo">
  </div>

  <h1>AARIA PROPERTY LISTING</h1>
  <p class="subtitle">Welcome to Aaria — Personal AI Real Estate Consultant.</p>

  <!-- FORM -->
  <form id="propertyListingForm">

    <!-- SECTION CARDS (same as previous response) -->
    <!-- I am leaving all your fields 100% unchanged. -->
    
    <!-- Section 1 -->
    <div class="card">
      <h2>1. Your Information</h2>

      <label>Full Name *</label>
      <input type="text" id="fullName" name="fullName" required>

      <label>Contact Number *</label>
      <input type="text" id="contactNumber" name="contactNumber" required>

      <label>Email Address *</label>
      <input type="email" id="emailAddress" name="emailAddress" required>

      <label>Company / Organization</label>
      <input type="text" id="companyName" name="companyName">
    </div>

    <!-- SECTION 2 -->
    <div class="card">
      <h2>2. Plot & Property Specifications</h2>

      <label>Project / Plot Name *</label>
      <input type="text" id="projectName" name="projectName" required>

      <label>Project Type *</label>
      <select id="projectType" name="projectType" required>
        <option value="" disabled selected>Select Type</option>
        <option>Residential</option>
        <option>Commercial</option>
        <option>Industrial</option>
        <option>Farmhouse</option>
        <option>Agricultural Land</option>
        <option>Mixed-use</option>
      </select>

      <label>Plot Size *</label>
      <input type="text" id="plotSize" name="plotSize" required>

      <label>Total Project Area</label>
      <input type="text" id="totalArea" name="totalArea">

      <label>Exact Location / Address *</label>
      <textarea id="address" name="address" rows="2" required></textarea>

      <label>Nearby Landmarks</label>
      <input type="text" id="landmarks" name="landmarks">

      <label>Available Plot Units</label>
      <input type="text" id="availableUnits" name="availableUnits">
    </div>

    <!-- SECTION 3 -->
    <div class="card">
      <h2>3. Location & Community Features</h2>

      <label>Distance from City Centre</label>
      <input type="text" id="distanceCity" name="distanceCity">

      <label>Locality Category *</label>
      <select id="localityCategory" name="localityCategory" required>
        <option value="" disabled selected>Select Category</option>
        <option>Prime Location</option>
        <option>Developing Area</option>
        <option>Upcoming Hotspot</option>
        <option>Outskirts</option>
      </select>

      <label>Nearby Facilities</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="School / College" name="nearbyFacilities[]">School / College</label>
        <label><input type="checkbox" value="Hospital / Clinic" name="nearbyFacilities[]">Hospital / Clinic</label>
        <label><input type="checkbox" value="Market / Mall" name="nearbyFacilities[]">Market / Mall</label>
        <label><input type="checkbox" value="Public Transport" name="nearbyFacilities[]">Public Transport</label>
        <label><input type="checkbox" value="Metro / Highway" name="nearbyFacilities[]">Metro / Highway</label>
        <label><input type="checkbox" value="Park / Green" name="nearbyFacilities[]">Park / Green</label>
        <label><input type="checkbox" value="Bank / ATM" name="nearbyFacilities[]">Bank / ATM</label>
        <label><input type="checkbox" value="Religious Site" name="nearbyFacilities[]">Religious Site</label>
      </div>

      <label>Community Features</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="Gated Community" name="communityFeatures[]">Gated Community</label>
        <label><input type="checkbox" value="24×7 Security" name="communityFeatures[]">24×7 Security</label>
        <label><input type="checkbox" value="Power & Water" name="communityFeatures[]">Power & Water</label>
        <label><input type="checkbox" value="Wide Roads" name="communityFeatures[]">Wide Roads</label>
        <label><input type="checkbox" value="Drainage" name="communityFeatures[]">Drainage</label>
        <label><input type="checkbox" value="Street Lights" name="communityFeatures[]">Street Lights</label>
        <label><input type="checkbox" value="Park / Club" name="communityFeatures[]">Park / Club</label>
        <label><input type="checkbox" value="Internet" name="communityFeatures[]">Internet</label>
      </div>
    </div>

    <!-- SECTION 4 -->
    <div class="card">
      <h2>4. Pricing & Payment Terms</h2>

      <label>Price per Sq Yard / Sq Ft *</label>
      <input type="text" id="pricePerUnit" name="pricePerUnit" required>

      <label>Total Project Price</label>
      <input type="text" id="totalProjectPrice" name="totalProjectPrice">

      <label>Booking Amount</label>
      <input type="text" id="bookingAmount" name="bookingAmount">

      <label>Price Negotiable? *</label>
      <select id="priceNegotiable" name="priceNegotiable" required>
        <option value="" disabled selected>Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label>Payment Plans Available</label>
      <select id="paymentPlans" name="paymentPlans">
        <option value="" disabled selected>Select Plan</option>
        <option>Full Payment</option>
        <option>EMI</option>
        <option>Installments</option>
        <option>Loan Facility</option>
      </select>

      <label>Agent Commission Structure</label>
      <input type="text" id="agentCommission" name="agentCommission">
    </div>

    <!-- SECTION 5 -->
    <div class="card">
      <h2>5. Legal Status & Documentation</h2>

      <label>Ownership Type *</label>
      <select id="ownershipType" name="ownershipType" required>
        <option value="" disabled selected>Select Type</option>
        <option>Freehold</option>
        <option>Leasehold</option>
        <option>Group Housing</option>
      </select>

      <label>RERA Registered? *</label>
      <select id="reraRegistered" name="reraRegistered" required>
        <option value="" disabled selected>Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label>Approval Authority</label>
      <input type="text" id="approvalAuthority" name="approvalAuthority">

      <label>Registration Number</label>
      <input type="text" id="registrationNumber" name="registrationNumber">

      <label>Pending Dues or Disputes?</label>
      <select id="pendingDues" name="pendingDues">
        <option value="" disabled selected>Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>
    </div>

    <!-- SECTION 6 -->
    <div class="card">
      <h2>6. Marketing Strategy & Positioning</h2>

      <label>Ideal Buyer Profile *</label>
      <select id="idealBuyerProfile" name="idealBuyerProfile" required>
        <option value="" disabled selected>Select Profile</option>
        <option>Families</option>
        <option>Investors</option>
        <option>Builders</option>
        <option>NRIs</option>
        <option>Retired</option>
        <option>First-time Buyers</option>
      </select>

      <label>Pricing Strategy *</label>
      <select id="pricingStrategy" name="pricingStrategy" required>
        <option value="" disabled selected>Select Strategy</option>
        <option>Premium (High Demand)</option>
        <option>Mid-range (Competitive)</option>
        <option>Budget (Mass Appeal)</option>
      </select>

      <label>AI Communication Tone *</label>
      <select id="aiTone" name="aiTone" required>
        <option value="" disabled selected>Select Tone</option>
        <option>Professional & Polite</option>
        <option>Friendly & Warm</option>
        <option>Confident & Persuasive</option>
        <option>Calm & Reassuring</option>
      </select>

      <label>Top 3 USPs</label>
      <input type="text" id="usps" name="usps">

      <label>One-liner Sales Pitch</label>
      <input type="text" id="salesPitch" name="salesPitch">

      <label>Current Marketing Channels</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="Facebook" name="marketingChannels[]">Facebook</label>
        <label><input type="checkbox" value="WhatsApp" name="marketingChannels[]">WhatsApp</label>
        <label><input type="checkbox" value="Calls" name="marketingChannels[]">Calls</label>
        <label><input type="checkbox" value="Brokers" name="marketingChannels[]">Brokers</label>
        <label><input type="checkbox" value="Print Ads" name="marketingChannels[]">Print Ads</label>
        <label><input type="checkbox" value="Instagram" name="marketingChannels[]">Instagram</label>
      </div>

      <label>Special Instructions</label>
      <textarea id="specialInstructions" name="specialInstructions" rows="2"></textarea>
    </div>

    <button type="submit" class="btn-submit">Submit Listing</button>

  </form>

  <!-- SUBMISSION SUMMARY SCREEN -->
  <div id="submissionSummary">
    <h2 class="summary-title">Submission Summary</h2>

    <div id="summaryContent"></div>

    <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
  </div>

</div>

<!-- JS to display summary after submission -->
<script>
document.getElementById("propertyListingForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let form = new FormData(this);
  let outputHTML = "";

  form.forEach((value, key) => {
    outputHTML += `
      <div class="summary-block">
        <strong>${key}</strong><br>
        <span>${value}</span>
      </div>
    `;
  });

  document.getElementById("summaryContent").innerHTML = outputHTML;

  document.getElementById("propertyListingForm").style.display = "none";
  document.getElementById("submissionSummary").style.display = "block";
});
</script>

</body>
</html>
